<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450" role="img" aria-labelledby="d2-title d2-desc">
<title id="d2-title">D2. Three constructive property-separation witnesses</title>
<desc id="d2-desc">Three counterexample witnesses show that ciphertext availability does not imply dispute-key availability, routine audit acceptance does not imply targeted dispute success, and finite audits do not guarantee future dispute-key availability. This is not a complete pairwise lattice.</desc>
<metadata>canonical_source=diagrams/02_property_separation.mmd;sha256=0095ad17ec7769021ea43fc507c5c8e95890646b41bc04008a76b95eaa3ed68d;status=PREAUTHORIZATION_DERIVATIVE</metadata>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#24364b"/></marker></defs>
<style>
.background{fill:#ffffff}.title{font-family:Helvetica,Arial,sans-serif;font-weight:700;fill:#102a43}.subtitle{font-family:Helvetica,Arial,sans-serif;font-weight:500;fill:#334e68}.body{font-family:Helvetica,Arial,sans-serif;font-weight:500;fill:#102a43}.small{font-family:Helvetica,Arial,sans-serif;font-weight:600;letter-spacing:1px;fill:#243b53}.witness{fill:#e8f1fb;stroke:#1463a5;stroke-width:3}.holds{fill:#edf7ed;stroke:#276738;stroke-width:3}.fails{fill:#fff1f0;stroke:#a32620;stroke-width:3;stroke-dasharray:10 6}.conclusion{fill:#fff8dc;stroke:#8a5a00;stroke-width:4}.boundary{fill:#e7f7f5;stroke:#006d6f;stroke-width:4}.arrow{fill:none;stroke:#24364b;stroke-width:3}.dashed{stroke-dasharray:9 7}
</style>
<rect width="1600" height="1450" class="background"/>
<text x="800" y="58" text-anchor="middle" class="title" font-size="36px"><tspan x="800" dy="0">D2. Property separation by constructive witnesses</tspan></text>
<text x="800" y="96" text-anchor="middle" class="subtitle" font-size="24px"><tspan x="800" dy="0">Exactly three claim-bearing non-implications — not a complete pairwise lattice</tspan></text>
<g data-witness="W1">
<rect x="55" y="190" width="500" height="230" rx="18" class="witness"/>
<text x="305" y="232" text-anchor="middle" class="body" font-size="24px"><tspan x="305" dy="0">W1 — ciphertext availability</tspan><tspan x="305" dy="30">Ciphertext remains retrievable;</tspan><tspan x="305" dy="30">only t−1 valid dispute responses</tspan><tspan x="305" dy="30">arrive by the deadline.</tspan></text>
<rect x="650" y="190" width="370" height="92" rx="18" class="holds"/>
<text x="835" y="222" text-anchor="middle" class="body" font-size="24px"><tspan x="835" dy="0">HOLDS</tspan><tspan x="835" dy="30">Ciphertext availability (CA)</tspan></text>
<rect x="650" y="318" width="370" height="112" rx="18" class="fails"/>
<text x="835" y="350" text-anchor="middle" class="body" font-size="24px"><tspan x="835" dy="0">FAILS</tspan><tspan x="835" dy="30">Authorized decryptability (AD),</tspan><tspan x="835" dy="30">deadline liveness (DDL), and DKA</tspan></text>
<rect x="1115" y="228" width="430" height="154" rx="18" class="conclusion"/>
<text x="1330" y="266" text-anchor="middle" class="body" font-size="24px"><tspan x="1330" dy="0">NON-IMPLICATION 1</tspan><tspan x="1330" dy="30">CA does not imply DKA</tspan></text>
<path d="M 555 260 L 650 236" class="arrow" marker-end="url(#arrowhead)"/>
<path d="M 555 350 L 650 374" class="arrow" marker-end="url(#arrowhead)"/>
<path d="M 1020 236 L 1115 282" class="arrow dashed" marker-end="url(#arrowhead)"/>
<path d="M 1020 374 L 1115 328" class="arrow dashed" marker-end="url(#arrowhead)"/>
</g>
<g data-witness="W2">
<rect x="55" y="550" width="500" height="230" rx="18" class="witness"/>
<text x="305" y="592" text-anchor="middle" class="body" font-size="24px"><tspan x="305" dy="0">W2 — selective withholding</tspan><tspan x="305" dy="30">At least q_accept sampled canaries respond;</tspan><tspan x="305" dy="30">fewer than t valid responses arrive</tspan><tspan x="305" dy="30">for the target dispute record.</tspan></text>
<rect x="650" y="550" width="370" height="92" rx="18" class="holds"/>
<text x="835" y="582" text-anchor="middle" class="body" font-size="24px"><tspan x="835" dy="0">HOLDS</tspan><tspan x="835" dy="30">Routine audit acceptance (AKR)</tspan></text>
<rect x="650" y="678" width="370" height="112" rx="18" class="fails"/>
<text x="835" y="710" text-anchor="middle" class="body" font-size="24px"><tspan x="835" dy="0">FAILS</tspan><tspan x="835" dy="30">Target-record AD and DDL</tspan></text>
<rect x="1115" y="588" width="430" height="154" rx="18" class="conclusion"/>
<text x="1330" y="626" text-anchor="middle" class="body" font-size="24px"><tspan x="1330" dy="0">NON-IMPLICATION 2</tspan><tspan x="1330" dy="30">A passed routine audit does not</tspan><tspan x="1330" dy="30">unconditionally imply targeted</tspan><tspan x="1330" dy="30">dispute success.</tspan></text>
<path d="M 555 620 L 650 596" class="arrow" marker-end="url(#arrowhead)"/>
<path d="M 555 710 L 650 734" class="arrow" marker-end="url(#arrowhead)"/>
<path d="M 1020 596 L 1115 642" class="arrow dashed" marker-end="url(#arrowhead)"/>
<path d="M 1020 734 L 1115 688" class="arrow dashed" marker-end="url(#arrowhead)"/>
</g>
<g data-witness="W3">
<rect x="55" y="910" width="500" height="230" rx="18" class="witness"/>
<text x="305" y="952" text-anchor="middle" class="body" font-size="24px"><tspan x="305" dy="0">W3 — finite-prefix ambiguity</tspan><tspan x="305" dy="30">Two executions share the same</tspan><tspan x="305" dy="30">finite audit prefix; later</tspan><tspan x="305" dy="30">custodian readiness diverges.</tspan></text>
<rect x="650" y="910" width="370" height="92" rx="18" class="holds"/>
<text x="835" y="942" text-anchor="middle" class="body" font-size="24px"><tspan x="835" dy="0">HOLDS</tspan><tspan x="835" dy="30">Identical finite audit observations</tspan></text>
<rect x="650" y="1038" width="370" height="112" rx="18" class="fails"/>
<text x="835" y="1070" text-anchor="middle" class="body" font-size="24px"><tspan x="835" dy="0">FAILS</tspan><tspan x="835" dy="30">Unconditional future AD/DDL</tspan><tspan x="835" dy="30">in one continuation</tspan></text>
<rect x="1115" y="948" width="430" height="154" rx="18" class="conclusion"/>
<text x="1330" y="986" text-anchor="middle" class="body" font-size="24px"><tspan x="1330" dy="0">NON-IMPLICATION 3</tspan><tspan x="1330" dy="30">Finite audits do not guarantee</tspan><tspan x="1330" dy="30">unconditional future DKA.</tspan></text>
<path d="M 555 980 L 650 956" class="arrow" marker-end="url(#arrowhead)"/>
<path d="M 555 1070 L 650 1094" class="arrow" marker-end="url(#arrowhead)"/>
<path d="M 1020 956 L 1115 1002" class="arrow dashed" marker-end="url(#arrowhead)"/>
<path d="M 1020 1094 L 1115 1048" class="arrow dashed" marker-end="url(#arrowhead)"/>
</g>
<rect x="250" y="1288" width="1100" height="112" rx="18" class="boundary"/>
<text x="800" y="1328" text-anchor="middle" class="body" font-size="24px"><tspan x="800" dy="0">BOUNDARY</tspan><tspan x="800" dy="30">DKA is conditional and deadline-bounded; PAC and declared readiness/network</tspan><tspan x="800" dy="30">assumptions remain separate obligations.</tspan></text>
</svg>
