<style>.bg{fill:#ffffff}.title{font-family:Helvetica,Arial,sans-serif;font-weight:700;fill:#102a43}.subtitle,.heading{font-family:Helvetica,Arial,sans-serif;font-weight:600;fill:#334e68}.body,.edge-label{font-family:Helvetica,Arial,sans-serif;font-weight:500;fill:#102a43}.node{fill:#e8f1fb;stroke:#1463a5;stroke-width:3}.control{fill:#edf7ed;stroke:#276738;stroke-width:3}.boundary{fill:#fff8dc;stroke:#8a5a00;stroke-width:4;stroke-dasharray:11 7}.offline{fill:#fff1f0;stroke:#a32620;stroke-width:4;stroke-dasharray:11 7}.terminal{fill:#e7f7f5;stroke:#006d6f;stroke-width:4}.edge{fill:none;stroke:#24364b;stroke-width:3}.dashed{stroke-dasharray:10 7}.label-bg{fill:#ffffff;stroke:#c5d2df;stroke-width:1}.lane{fill:#f7fafc;stroke:#627d98;stroke-width:2;stroke-dasharray:12 7}.start{fill:#24364b;stroke:#ffffff;stroke-width:3}</style>
<rect width="1600" height="1080" class="bg"/>
<text x="800" y="56" text-anchor="middle" class="title" font-size="38px"><tspan x="800" dy="0">D7. Uniform and domain-stratified sampling under domain outage</tspan></text>
<text x="800" y="96" text-anchor="middle" class="subtitle" font-size="24px"><tspan x="800" dy="0">Canonical Mermaid source-bound preauthorization derivative</tspan></text>
<g><rect x="55" y="180" width="320" height="120" rx="16" class="control"/><text x="215" y="233" text-anchor="middle" class="body" font-size="24px"><tspan x="215" dy="0">Domain A</tspan><tspan x="215" dy="30">8 online</tspan></text></g>
<g><rect x="445" y="180" width="320" height="120" rx="16" class="control"/><text x="605" y="233" text-anchor="middle" class="body" font-size="24px"><tspan x="605" dy="0">Domain B</tspan><tspan x="605" dy="30">8 online</tspan></text></g>
<g><rect x="835" y="180" width="320" height="120" rx="16" class="offline"/><text x="995" y="233" text-anchor="middle" class="body" font-size="24px"><tspan x="995" dy="0">Domain C</tspan><tspan x="995" dy="30">8 OFFLINE</tspan></text></g>
<g><rect x="1225" y="180" width="320" height="120" rx="16" class="control"/><text x="1385" y="233" text-anchor="middle" class="body" font-size="24px"><tspan x="1385" dy="0">Domain D</tspan><tspan x="1385" dy="30">8 online</tspan></text></g>
<path d="M375,240 L445,240" class="edge"/>
<path d="M765,240 L835,240" class="edge"/>
<path d="M1155,240 L1225,240" class="edge"/>
<g><rect x="120" y="560" width="580" height="170" rx="16" class="node"/><text x="410" y="623" text-anchor="middle" class="body" font-size="24px"><tspan x="410" dy="0">Uniform sample s=8</tspan><tspan x="410" dy="30">may miss or under-sample</tspan><tspan x="410" dy="30">a failed domain</tspan></text></g>
<g><rect x="900" y="560" width="580" height="170" rx="16" class="terminal"/><text x="1190" y="623" text-anchor="middle" class="body" font-size="24px"><tspan x="1190" dy="0">Stratified sample s=8</tspan><tspan x="1190" dy="30">two samples per domain</tspan><tspan x="1190" dy="30">complete outage observed</tspan></text></g>
<path d="M215,300 L310,560" class="edge" marker-end="url(#arrow)"/>
<path d="M1385,300 L510,560" class="edge" marker-end="url(#arrow)"/>
<path d="M215,300 L1000,560" class="edge" marker-end="url(#arrow)"/>
<path d="M605,300 L1100,560" class="edge" marker-end="url(#arrow)"/>
