<path d="M1385,300 L1300,560" class="edge" marker-end="url(#arrow)"/>
<g><rect x="68" y="825" width="665" height="46" rx="8" class="label-bg"/><text x="400" y="850" text-anchor="middle" class="edge-label" font-size="24px"><tspan x="400" dy="0">Uniform: fault-domain coverage is not guaranteed.</tspan></text></g>
<g><rect x="894" y="825" width="613" height="46" rx="8" class="label-bg"/><text x="1200" y="850" text-anchor="middle" class="edge-label" font-size="24px"><tspan x="1200" dy="0">Stratified: every declared domain is sampled.</tspan></text></g>
<g><rect x="143" y="990" width="1315" height="46" rx="8" class="label-bg"/><text x="800" y="1015" text-anchor="middle" class="edge-label" font-size="24px"><tspan x="800" dy="0">Declared domain labels remain an assumption; color is reinforced by OFFLINE text and dashed border.</tspan></text></g>
