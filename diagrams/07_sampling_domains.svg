<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="d7-title d7-desc">
<title id="d7-title">D7. Uniform and domain-stratified sampling under domain outage</title>
<desc id="d7-desc">Illustration of a 32-member committee partitioned across four fault domains with one domain offline, contrasting uniform sampling with domain-stratified sampling for correlated-failure detection.</desc>
<metadata>canonical_source=diagrams/07_sampling_domains.mmd;sha256=d1d1c6ca8a5898971505901e95a9ef5dcd75424db906c583c29967cd45b09571;status=PREAUTHORIZATION_VISUAL_DERIVATIVE;evidence=NOT_SCIENTIFIC_EVIDENCE;independence=SAME_WORKSPACE_NOT_INDEPENDENT</metadata>
